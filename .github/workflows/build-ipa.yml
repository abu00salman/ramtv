name: Build all platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: RaM-tv-unsigned.ipa

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android and Android TV (APK)
        run: bash app/ci/android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        shell: bash
        run: bash app/ci/windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        run: bash app/ci/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [ios, android, windows, macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: List files
        run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RaM tv build ${{ github.run_number }}
          files: files/*
          body: |
            ## RaM tv
            - iPhone / iPad: `RaM-tv-unsigned.ipa` (sign it with Sideloadly / AltStore)
            - Android phones & tablets + Android TV: `RaM-tv-Android-arm64.apk` (most devices). Older 32-bit TV sticks: `RaM-tv-Android-arm32.apk`
            - Windows 10/11: `RaM-tv-Windows-x64.zip` (unzip, run `ramtv.exe`)
            - macOS: `RaM-tv-macOS.zip` (unzip, right-click the app > Open the first time)
