name: Build all platforms

on:
  push:
    branches: [main, 'development/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: python3 -m unittest discover -s ci/tests -v
        working-directory: app

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: bash build.sh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Test iPhone preferences and PiP ownership
        run: bash tools/test_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: RaM-tv-unsigned.ipa

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build Android and Android TV (APK)
        run: bash app/ci/android.sh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build Windows
        shell: bash
        run: bash app/ci/windows.sh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build macOS
        run: bash app/ci/macos.sh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [quality, ios, android, windows, macos]
    if: ${{ success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/development/tv-')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: List files
        run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          target_commitish: ${{ github.sha }}
          name: RaM tv build ${{ github.run_number }}
          files: files/*
          body: |
            ## RaM tv
            - iPhone / iPad: `RaM-tv-unsigned.ipa` (sign it with Sideloadly / AltStore)
            - Android phones & tablets + Android TV: `RaM-tv-Android-arm64.apk` (most devices). Older 32-bit TV sticks: `RaM-tv-Android-arm32.apk`
            - Windows 10/11: `RaM-tv-Windows-x64.zip` (unzip, run `ramtv.exe`)
            - macOS: `RaM-tv-macOS.zip` (unzip, right-click the app > Open the first time)
